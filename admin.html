<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دەستەی کۆنتڕۆڵی پارێزراو</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --primary: #007bff; --danger: #dc3545; --success: #28a745; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: white; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        
        /* ستایلی شاشەی لۆگین */
        #login-screen { background: #2d2d2d; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 320px; z-index: 100; transition: 0.5s; }
        #login-screen h2 { margin-bottom: 25px; color: var(--primary); }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #444; background: #3d3d3d; color: white; box-sizing: border-box; text-align: center; font-size: 18px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .btn-login { background: var(--primary); color: white; }
        .btn-login:hover { background: #0056b3; }

        /* ستایلی شاشەی ئەدمین (سەرەتا شاراوەیە) */
        #admin-panel { display: none; background: #2d2d2d; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .status-dot { width: 12px; height: 12px; background: #555; border-radius: 50%; display: inline-block; margin-left: 8px; }
        .online { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .controls { display: flex; gap: 10px; flex-direction: column; }
        .btn-start { background: var(--success); color: white; }
        .btn-stop { background: var(--danger); color: white; }
        #log { margin-top: 20px; font-size: 14px; color: #aaa; background: #1a1a1a; padding: 10px; border-radius: 8px; min-height: 40px; }
    </style>
</head>
<body>

    <!-- شاشەی لۆگین -->
    <div id="login-screen">
        <h2>چوونەژوورەوە</h2>
        <input type="password" id="passInput" placeholder="پاسۆرد بنووسە...">
        <button class="btn btn-login" onclick="checkAuth()">داخلبوون</button>
    </div>

    <!-- شاشەی کۆنتڕۆڵی سەرەکی -->
    <div id="admin-panel">
        <h2 style="margin-bottom: 5px;">کۆنتڕۆڵی مایک <div id="dot" class="status-dot"></div></h2>
        <p id="peer-id-display" style="font-size: 12px; color: #888; margin-bottom: 20px;">ID: Connecting...</p>
        
        <div class="controls">
            <input type="number" id="invId" placeholder="ژمارەی فاتورە (نموونە: 505)">
            <button class="btn btn-start" onclick="startCall()">بەکارهێنانی مایک (ON)</button>
            <button class="btn btn-stop" onclick="endCall()">بڕینی مایک (OFF)</button>
        </div>

        <div id="log">ئامادەیە بۆ پەیوەندی</div>
        <audio id="remoteAudio" autoplay></audio>
    </div>

    <script>
        const AUTH_PASS = "123456"; // لێرە پاسۆردەکەت بگۆڕە
        let peer;
        let currentCall;

        function checkAuth() {
            const input = document.getElementById('passInput').value;
            if (input === AUTH_PASS) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                initPeer();
            } else {
                alert("پاسۆرد هەڵەیە!");
            }
        }

        function initPeer() {
            peer = new Peer();
            peer.on('open', (id) => {
                document.getElementById('peer-id-display').innerText = "ID: " + id;
                document.getElementById('dot').classList.add('online');
            });
            
            peer.on('error', (err) => {
                updateLog("هەڵە لە سێرڤەر: " + err.type);
            });
        }

        function updateLog(msg) {
            document.getElementById('log').innerText = msg;
        }

        function startCall() {
            const id = document.getElementById('invId').value;
            if(!id) return alert("ژمارەی فاتورە بنووسە");

            updateLog("خەریکی پەیوەندییە بە " + id + "...");
            
            // دروستکردنی پەیوەندی VoIP
            currentCall = peer.call('voip-' + id, new MediaStream());

            currentCall.on('stream', stream => {
                document.getElementById('remoteAudio').srcObject = stream;
                updateLog("✅ پەیوەندی دروست بوو - گوێت لێیەتی");
            });

            currentCall.on('close', () => {
                updateLog("پەیوەندی بڕدرا");
            });
        }

        function endCall() {
            if(currentCall) {
                currentCall.close();
                updateLog("🔴 مایک کوژایەوە");
            }
        }
    </script>
</body>
</html>
